services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.nas
    container_name: akhil-portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
